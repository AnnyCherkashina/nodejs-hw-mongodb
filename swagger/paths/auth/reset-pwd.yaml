# nodejs-hw-mongodb/swagger/paths/auth/reset-pwd.yaml
post:
  tags:
    - Auth
  summary: Reset user password
  operationId: resetPassword
  description: Reset a user's password using a valid reset token.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/ResetPasswordRequest'
  responses:
    '200':
      $ref: '../../../docs/openapi.yaml#/components/responses/PasswordResetSuccessResponse'
    '400':
      $ref: '../../../docs/openapi.yaml#/components/responses/BadRequestResponse'
    '401':
      description: Token is expired or invalid
      content:
        application/json:
          schema:
            $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
            example:
              status: 401
              message: 'Unauthorized'
              data: 'Token is expired or invalid.'
    '404':
      description: User not found
      content:
        application/json:
          schema:
            $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
            example:
              status: 404
              message: 'Not Found'
              data: 'User not found!'
    '500':
      $ref: '../../../docs/openapi.yaml#/components/responses/InternalServerErrorResponse'