get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getAllContacts
  description: Retrieve a paginated and sortable list of contacts for the authenticated user, with optional filtering by type and favorite status.
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination.
      example: 1
    - in: query
      name: perPage
      schema:
        type: integer
        minimum: 1
        default: 10
      description: Number of items per page for pagination.
      example: 10
    - in: query
      name: sortBy
      schema:
        type: string
        enum: [name, email, phoneNumber, contactType, isFavourite]
        default: name
      description: Field to sort the contacts by.
      example: name
    - in: query
      name: sortOrder
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort order (ascending or descending).
      example: asc
    - in: query
      name: type
      schema:
        type: string
        enum: [personal, work, home]
      description: Filter contacts by contact type.
      example: personal
    - in: query
      name: isFavourite
      schema:
        type: boolean
      description: Filter contacts by favorite status.
      example: true
  responses:
    '200':
      $ref: '../../../docs/openapi.yaml#/components/responses/SuccessContactsListResponse'
    '401':
      $ref: '../../../docs/openapi.yaml#/components/responses/UnauthorizedResponse'
    '500':
      $ref: '../../../docs/openapi.yaml#/components/responses/InternalServerErrorResponse'