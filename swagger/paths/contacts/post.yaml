tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact with the provided details, including an optional photo.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            description: Name of the contact.
            example: New Contact
          phoneNumber:
            type: string
            minLength: 5
            maxLength: 20
            description: Phone number of the contact.
            example: '+380671112233'
          email:
            type: string
            format: email
            description: Email of the contact.
            example: new.contact@example.com
          contactType:
            type: string
            enum: [personal, work, home]
            description: Type of contact.
            example: personal
          isFavourite:
            type: boolean
            description: Whether the contact is a favorite.
            example: false
          photo:
            type: string
            format: binary
            description: Optional photo file for the contact.
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: number
              example: 201
            message:
              type: string
              example: 'Contact created successfully'
            data:
              $ref: '../../../docs/openapi.yaml#/components/schemas/Contact'
  '400':
    description: Invalid input or missing required fields.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: number
              example: 400
            message:
              type: string
              example: 'Bad Request: Invalid data provided or missing required fields'
  '401':
    description: Unauthorized - authentication token is missing or invalid.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: number
              example: 401
            message:
              type: string
              example: 'Unauthorized: Access token is missing or invalid'