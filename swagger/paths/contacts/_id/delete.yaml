delete:
  tags:
    - Contacts
  summary: Delete a contact by ID
  operationId: deleteContact
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      schema:
        type: string
      required: true
      description: ID of the contact to delete
      example: 60d5ec49f8a3c9001c9b4d8a
  responses:
    '200':
      description: Contact successfully deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              message:
                type: string
                example: 'Contact deleted successfully'
              data:
                type: object
                nullable: true
                example: null
    '401':
      $ref: '../../../../docs/openapi.yaml#/components/responses/UnauthorizedResponse' 
    '404':
      $ref: '../../../../docs/openapi.yaml#/components/responses/ContactNotFoundResponse'
    '400':
      $ref: '../../../../docs/openapi.yaml#/components/responses/BadRequestResponse'
    '500':
      $ref: '../../../../docs/openapi.yaml#/components/responses/InternalServerErrorResponse' # 